<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>現場写真整理</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=Share+Tech+Mono&display=swap');

  :root {
    --bg: #0f1117;
    --surface: #1a1d27;
    --surface2: #22263a;
    --border: #2e3352;
    --accent: #ff6b35;
    --accent2: #ffd166;
    --text: #e8eaf0;
    --text-muted: #7a7f9a;
    --success: #06d6a0;
    --error: #ef476f;
    --mono: 'Share Tech Mono', monospace;
    --sans: 'Noto Sans JP', sans-serif;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 24px 16px 60px;
  }

  /* ── ヘッダー ── */
  header {
    width: 100%;
    max-width: 640px;
    margin-bottom: 32px;
    display: flex;
    align-items: center;
    gap: 14px;
  }
  .logo-icon {
    width: 44px; height: 44px;
    background: var(--accent);
    border-radius: 10px;
    display: flex; align-items: center; justify-content: center;
    font-size: 22px; flex-shrink: 0;
  }
  header h1 {
    font-size: 18px; font-weight: 700; letter-spacing: .04em;
    line-height: 1.2;
  }
  header p { font-size: 12px; color: var(--text-muted); margin-top: 2px; }

  /* ── カード ── */
  .card {
    width: 100%; max-width: 640px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 24px;
    margin-bottom: 16px;
  }
  .card-title {
    font-size: 11px; font-weight: 700; letter-spacing: .12em;
    color: var(--accent);
    text-transform: uppercase;
    margin-bottom: 18px;
    display: flex; align-items: center; gap: 8px;
  }
  .card-title::after {
    content: '';
    flex: 1; height: 1px;
    background: var(--border);
  }

  /* ── フォーム ── */
  .field { margin-bottom: 16px; }
  .field:last-child { margin-bottom: 0; }
  label {
    display: block;
    font-size: 11px; font-weight: 700; letter-spacing: .08em;
    color: var(--text-muted);
    text-transform: uppercase;
    margin-bottom: 6px;
  }
  input[type="text"], input[type="date"] {
    width: 100%;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    font-family: var(--sans);
    font-size: 15px;
    padding: 11px 14px;
    outline: none;
    transition: border-color .2s;
  }
  input[type="text"]:focus, input[type="date"]:focus {
    border-color: var(--accent);
  }
  input[type="date"]::-webkit-calendar-picker-indicator {
    filter: invert(0.6);
  }

  /* ── ドロップゾーン ── */
  .dropzone {
    border: 2px dashed var(--border);
    border-radius: 12px;
    padding: 36px 20px;
    text-align: center;
    cursor: pointer;
    transition: border-color .2s, background .2s;
    position: relative;
  }
  .dropzone.drag-over {
    border-color: var(--accent);
    background: rgba(255,107,53,.07);
  }
  .dropzone input[type="file"] {
    position: absolute; inset: 0; opacity: 0; cursor: pointer; width: 100%; height: 100%;
  }
  .drop-icon { font-size: 36px; margin-bottom: 10px; }
  .drop-text { font-size: 14px; color: var(--text-muted); }
  .drop-sub { font-size: 12px; color: var(--text-muted); margin-top: 4px; }

  /* ── プレビューグリッド ── */
  #preview-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(80px, 1fr));
    gap: 8px;
    margin-top: 14px;
  }
  .preview-item {
    position: relative;
    aspect-ratio: 1;
    border-radius: 8px;
    overflow: hidden;
    background: var(--surface2);
  }
  .preview-item img {
    width: 100%; height: 100%; object-fit: cover;
  }
  .preview-item .name-badge {
    position: absolute; bottom: 0; left: 0; right: 0;
    background: rgba(0,0,0,.7);
    font-size: 9px; font-family: var(--mono);
    color: #fff;
    padding: 3px 4px;
    line-height: 1.2;
    word-break: break-all;
  }
  .preview-count {
    font-size: 12px; color: var(--accent2);
    font-family: var(--mono);
    margin-top: 10px;
  }

  /* ── ファイル名プレビュー ── */
  #filename-preview {
    background: var(--surface2);
    border-radius: 8px;
    padding: 12px 14px;
    font-family: var(--mono);
    font-size: 12px;
    color: var(--text-muted);
    line-height: 1.8;
    margin-top: 4px;
    min-height: 44px;
  }
  #filename-preview .fn-folder { color: var(--accent2); }
  #filename-preview .fn-file { color: var(--success); }

  /* ── Google Drive 設定 ── */
  .drive-status {
    display: flex; align-items: center; gap: 10px;
    font-size: 13px;
  }
  .status-dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--text-muted);
    flex-shrink: 0;
  }
  .status-dot.connected { background: var(--success); }
  .status-dot.error { background: var(--error); }

  /* ── ボタン ── */
  .btn {
    width: 100%; max-width: 640px;
    padding: 16px;
    border: none; border-radius: 12px;
    font-family: var(--sans);
    font-size: 15px; font-weight: 700;
    cursor: pointer;
    transition: opacity .2s, transform .1s;
    display: flex; align-items: center; justify-content: center; gap: 8px;
  }
  .btn:active { transform: scale(.98); }
  .btn-primary {
    background: var(--accent);
    color: #fff;
  }
  .btn-primary:disabled {
    opacity: .4; cursor: not-allowed;
  }
  .btn-secondary {
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--text);
    margin-bottom: 16px;
    max-width: 640px;
    width: 100%;
  }

  /* ── ログ ── */
  #log {
    width: 100%; max-width: 640px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 20px;
    margin-top: 16px;
    display: none;
  }
  #log.visible { display: block; }
  .log-line {
    font-family: var(--mono);
    font-size: 12px;
    line-height: 2;
    display: flex; align-items: flex-start; gap: 8px;
  }
  .log-line .icon { flex-shrink: 0; }
  .log-line.ok .icon { color: var(--success); }
  .log-line.err .icon { color: var(--error); }
  .log-line.info .icon { color: var(--accent2); }
  .log-line.info { color: var(--text-muted); }

  /* ── 完了バナー ── */
  #done-banner {
    display: none;
    width: 100%; max-width: 640px;
    background: linear-gradient(135deg, #06d6a033, #06d6a011);
    border: 1px solid var(--success);
    border-radius: 12px;
    padding: 16px 20px;
    margin-top: 16px;
    text-align: center;
  }
  #done-banner.visible { display: block; }
  #done-banner strong { color: var(--success); font-size: 15px; }
  #done-banner p { font-size: 12px; color: var(--text-muted); margin-top: 4px; }

  /* ── エラーバナー ── */
  .err-banner {
    background: #ef476f22;
    border: 1px solid var(--error);
    border-radius: 8px;
    padding: 10px 14px;
    font-size: 12px;
    color: var(--error);
    margin-top: 12px;
    display: none;
  }

  /* ── スピナー ── */
  @keyframes spin { to { transform: rotate(360deg); } }
  .spinner {
    width: 18px; height: 18px;
    border: 2px solid rgba(255,255,255,.3);
    border-top-color: #fff;
    border-radius: 50%;
    animation: spin .7s linear infinite;
    display: none;
  }
  .loading .spinner { display: block; }
  .loading .btn-label { display: none; }

  /* ── レスポンシブ ── */
  @media (max-width: 400px) {
    #preview-grid { grid-template-columns: repeat(auto-fill, minmax(64px, 1fr)); }
  }
</style>
</head>
<body>

<header>
  <div class="logo-icon">🏗️</div>
  <div>
    <h1>現場写真整理</h1>
    <p>解体工事 / 現場記録管理システム</p>
  </div>
</header>

<!-- ① 現場情報 -->
<div class="card">
  <div class="card-title">01 現場情報</div>
  <div class="field">
    <label>施工日</label>
    <input type="date" id="f-date">
  </div>
  <div class="field">
    <label>住所</label>
    <input type="text" id="f-address" placeholder="例：東京都渋谷区〇〇1-2-3">
  </div>
  <div class="field">
    <label>現場名</label>
    <input type="text" id="f-name" placeholder="例：田中邸">
  </div>
</div>

<!-- ② 写真 -->
<div class="card">
  <div class="card-title">02 写真を選択</div>
  <div class="dropzone" id="dropzone">
    <input type="file" id="file-input" accept="image/*" multiple>
    <div class="drop-icon">📷</div>
    <div class="drop-text">写真をここにドロップ</div>
    <div class="drop-sub">またはタップして選択（複数枚OK）</div>
  </div>
  <div id="preview-count" class="preview-count" style="display:none"></div>
  <div id="preview-grid"></div>
</div>

<!-- ③ ファイル名プレビュー -->
<div class="card">
  <div class="card-title">03 ファイル名プレビュー</div>
  <div id="filename-preview">現場情報と写真を入力すると自動生成されます</div>
</div>

<!-- ④ Google Drive 設定 -->
<div class="card">
  <div class="card-title">04 Google Drive 設定</div>
  <div class="field">
    <label>保存先フォルダID</label>
    <input type="text" id="f-folder-id" placeholder="Google DriveフォルダのID（URLの末尾）">
  </div>
  <div class="field">
    <label>Google Client ID</label>
    <input type="text" id="f-client-id" placeholder="Google Cloud ConsoleのOAuth Client ID">
  </div>
  <div class="drive-status" style="margin-top:4px">
    <div class="status-dot" id="status-dot"></div>
    <span id="status-text" style="font-size:12px;color:var(--text-muted)">未接続</span>
  </div>
  <div class="err-banner" id="auth-err"></div>
</div>

<button class="btn btn-secondary" id="btn-auth" onclick="connectDrive()">
  🔗 Google Drive に接続する
</button>

<button class="btn btn-primary" id="btn-run" onclick="run()" disabled>
  <span class="btn-label">🚀 整理して保存する</span>
  <div class="spinner"></div>
</button>

<div id="log"></div>
<div id="done-banner">
  <strong>✅ 完了しました！</strong>
  <p id="done-text"></p>
</div>

<script>
// ─────────────────────────────────────────────
//  State
// ─────────────────────────────────────────────
let files = [];
let accessToken = null;
let tokenExpiry = 0;

// ─────────────────────────────────────────────
//  Helpers
// ─────────────────────────────────────────────
function fmtDate(dateStr) {
  // "2026-04-20" → { folder: "2026.4.20", file: "20260420" }
  if (!dateStr) return { folder: '', file: '' };
  const [y, m, d] = dateStr.split('-');
  return {
    folder: `${y}.${parseInt(m)}.${parseInt(d)}`,
    file: `${y}${m}${d}`
  };
}

function folderName() {
  const date = fmtDate(document.getElementById('f-date').value).folder;
  const addr = document.getElementById('f-address').value.trim();
  const name = document.getElementById('f-name').value.trim();
  if (!date && !addr && !name) return '';
  return [date, addr, name].filter(Boolean).join('-');
}

function fileNames() {
  const { file: dateFile } = fmtDate(document.getElementById('f-date').value);
  const name = document.getElementById('f-name').value.trim();
  return files.map((_, i) => {
    const num = String(i + 1).padStart(3, '0');
    const ext = files[i].name.split('.').pop().toLowerCase() || 'jpg';
    return `${dateFile}_${name}_${num}.${ext}`;
  });
}

// ─────────────────────────────────────────────
//  Preview update
// ─────────────────────────────────────────────
function updatePreview() {
  const grid = document.getElementById('preview-grid');
  const countEl = document.getElementById('preview-count');
  const fpreview = document.getElementById('filename-preview');

  // ファイル名プレビュー
  const folder = folderName();
  const names = fileNames();
  if (!folder && files.length === 0) {
    fpreview.innerHTML = '現場情報と写真を入力すると自動生成されます';
  } else {
    let html = '';
    if (folder) html += `<div class="fn-folder">📁 ${folder}/</div>`;
    names.slice(0, 5).forEach(n => {
      html += `<div class="fn-file">&nbsp;&nbsp;📷 ${n}</div>`;
    });
    if (names.length > 5) {
      html += `<div style="color:var(--text-muted)">&nbsp;&nbsp;... 他 ${names.length - 5} 枚</div>`;
    }
    fpreview.innerHTML = html || '現場情報と写真を入力すると自動生成されます';
  }

  // 写真グリッド
  grid.innerHTML = '';
  if (files.length === 0) {
    countEl.style.display = 'none';
    return;
  }
  countEl.style.display = 'block';
  countEl.textContent = `${files.length} 枚選択中`;

  files.slice(0, 20).forEach((f, i) => {
    const url = URL.createObjectURL(f);
    const item = document.createElement('div');
    item.className = 'preview-item';
    item.innerHTML = `<img src="${url}" loading="lazy"><div class="name-badge">${names[i] || f.name}</div>`;
    grid.appendChild(item);
  });
  if (files.length > 20) {
    const more = document.createElement('div');
    more.className = 'preview-item';
    more.style.cssText = 'display:flex;align-items:center;justify-content:center;font-size:12px;color:var(--text-muted)';
    more.textContent = `+${files.length - 20}`;
    grid.appendChild(more);
  }

  checkRunnable();
}

function checkRunnable() {
  const ok = files.length > 0 &&
    document.getElementById('f-date').value &&
    document.getElementById('f-address').value.trim() &&
    document.getElementById('f-name').value.trim() &&
    accessToken;
  document.getElementById('btn-run').disabled = !ok;
}

// ─────────────────────────────────────────────
//  Drag & drop / file input
// ─────────────────────────────────────────────
const dz = document.getElementById('dropzone');
const fi = document.getElementById('file-input');

dz.addEventListener('dragover', e => { e.preventDefault(); dz.classList.add('drag-over'); });
dz.addEventListener('dragleave', () => dz.classList.remove('drag-over'));
dz.addEventListener('drop', e => {
  e.preventDefault(); dz.classList.remove('drag-over');
  files = Array.from(e.dataTransfer.files).filter(f => f.type.startsWith('image/'));
  updatePreview();
});
fi.addEventListener('change', () => {
  files = Array.from(fi.files);
  updatePreview();
});

['f-date','f-address','f-name'].forEach(id => {
  document.getElementById(id).addEventListener('input', updatePreview);
});

// ─────────────────────────────────────────────
//  Google OAuth (implicit flow)
// ─────────────────────────────────────────────
function connectDrive() {
  const clientId = document.getElementById('f-client-id').value.trim();
  if (!clientId) {
    showAuthErr('Client IDを入力してください');
    return;
  }
  const redirect = location.href.split('#')[0];
  const scope = 'https://www.googleapis.com/auth/drive.file';
  const url = `https://accounts.google.com/o/oauth2/v2/auth?client_id=${encodeURIComponent(clientId)}&redirect_uri=${encodeURIComponent(redirect)}&response_type=token&scope=${encodeURIComponent(scope)}&prompt=consent`;
  window.location.href = url;
}

// ページロード時にハッシュからトークンを回収
(function parseToken() {
  const hash = location.hash.slice(1);
  if (!hash) return;
  const params = Object.fromEntries(hash.split('&').map(p => p.split('=')));
  if (params.access_token) {
    accessToken = params.access_token;
    tokenExpiry = Date.now() + parseInt(params.expires_in || 3600) * 1000;
    history.replaceState(null, '', location.pathname + location.search);
    setDriveStatus(true);
    checkRunnable();
  }
})();

function setDriveStatus(ok) {
  const dot = document.getElementById('status-dot');
  const txt = document.getElementById('status-text');
  dot.className = 'status-dot ' + (ok ? 'connected' : 'error');
  txt.textContent = ok ? '接続済み ✓' : '接続失敗';
  txt.style.color = ok ? 'var(--success)' : 'var(--error)';
}

function showAuthErr(msg) {
  const el = document.getElementById('auth-err');
  el.textContent = msg;
  el.style.display = 'block';
}

// ─────────────────────────────────────────────
//  Google Drive API helpers
// ─────────────────────────────────────────────
async function driveRequest(url, opts = {}) {
  const res = await fetch(url, {
    ...opts,
    headers: {
      'Authorization': `Bearer ${accessToken}`,
      ...(opts.headers || {})
    }
  });
  if (!res.ok) {
    const err = await res.json().catch(() => ({}));
    throw new Error(err?.error?.message || `HTTP ${res.status}`);
  }
  return res.json();
}

async function findOrCreateFolder(name, parentId) {
  // 既存フォルダを検索
  const q = `name='${name}' and mimeType='application/vnd.google-apps.folder' and '${parentId}' in parents and trashed=false`;
  const search = await driveRequest(`https://www.googleapis.com/drive/v3/files?q=${encodeURIComponent(q)}&fields=files(id,name)`);
  if (search.files.length > 0) return search.files[0].id;

  // 新規作成
  const created = await driveRequest('https://www.googleapis.com/drive/v3/files', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      name,
      mimeType: 'application/vnd.google-apps.folder',
      parents: [parentId]
    })
  });
  return created.id;
}

async function uploadFile(file, newName, folderId) {
  const metadata = { name: newName, parents: [folderId] };
  const form = new FormData();
  form.append('metadata', new Blob([JSON.stringify(metadata)], { type: 'application/json' }));
  form.append('file', file);

  const res = await fetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id,name', {
    method: 'POST',
    headers: { 'Authorization': `Bearer ${accessToken}` },
    body: form
  });
  if (!res.ok) {
    const err = await res.json().catch(() => ({}));
    throw new Error(err?.error?.message || `Upload failed ${res.status}`);
  }
  return res.json();
}

// ─────────────────────────────────────────────
//  Log
// ─────────────────────────────────────────────
function log(type, icon, msg) {
  const el = document.getElementById('log');
  el.classList.add('visible');
  const line = document.createElement('div');
  line.className = `log-line ${type}`;
  line.innerHTML = `<span class="icon">${icon}</span><span>${msg}</span>`;
  el.appendChild(line);
  el.scrollTop = el.scrollHeight;
}

// ─────────────────────────────────────────────
//  Main run
// ─────────────────────────────────────────────
async function run() {
  const btn = document.getElementById('btn-run');
  const logEl = document.getElementById('log');
  const doneBanner = document.getElementById('done-banner');

  // リセット
  logEl.innerHTML = '';
  logEl.classList.remove('visible');
  doneBanner.classList.remove('visible');

  // バリデーション
  if (!accessToken || Date.now() > tokenExpiry) {
    showAuthErr('Google Driveに再接続してください');
    return;
  }
  const parentId = document.getElementById('f-folder-id').value.trim();
  if (!parentId) { log('err','❌','保存先フォルダIDを入力してください'); return; }

  // UI: loading
  btn.classList.add('loading');
  btn.disabled = true;

  const folder = folderName();
  const names = fileNames();

  log('info', '📁', `フォルダを確認中: ${folder}`);
  let folderId;
  try {
    folderId = await findOrCreateFolder(folder, parentId);
    log('ok', '✅', `フォルダ準備完了`);
  } catch(e) {
    log('err', '❌', `フォルダ作成エラー: ${e.message}`);
    btn.classList.remove('loading'); btn.disabled = false;
    return;
  }

  let ok = 0, fail = 0;
  for (let i = 0; i < files.length; i++) {
    const newName = names[i];
    log('info', '⬆️', `アップロード中 (${i+1}/${files.length}): ${newName}`);
    try {
      await uploadFile(files[i], newName, folderId);
      log('ok', '✅', newName);
      ok++;
    } catch(e) {
      log('err', '❌', `${newName} — ${e.message}`);
      fail++;
    }
  }

  btn.classList.remove('loading'); btn.disabled = false;

  if (ok > 0) {
    doneBanner.classList.add('visible');
    document.getElementById('done-text').textContent =
      `${ok} 枚を「${folder}」に保存しました${fail > 0 ? `（${fail} 枚失敗）` : ''}`;
  }
}

// 今日の日付をデフォルトに
document.getElementById('f-date').value = new Date().toISOString().split('T')[0];
</script>
</body>
</html>
