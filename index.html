<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>現場写真整理</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=Share+Tech+Mono&display=swap');

  :root {
    --bg: #0f1117;
    --surface: #1a1d27;
    --surface2: #222536;
    --border: #2e3248;
    --accent: #4f8ef7;
    --accent2: #34d399;
    --warn: #f59e0b;
    --danger: #ef4444;
    --text: #e2e8f0;
    --text2: #94a3b8;
    --text3: #64748b;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Noto Sans JP', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    padding: 24px 16px 60px;
  }

  /* ヘッダー */
  .header {
    text-align: center;
    margin-bottom: 32px;
    padding-top: 8px;
  }
  .header-icon { font-size: 2rem; margin-bottom: 6px; }
  .header h1 {
    font-size: 1.35rem;
    font-weight: 700;
    letter-spacing: 0.05em;
    color: var(--text);
  }
  .header p {
    font-size: 0.75rem;
    color: var(--text3);
    margin-top: 4px;
    font-family: 'Share Tech Mono', monospace;
  }

  /* カード */
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 20px;
    margin-bottom: 16px;
  }
  .card-title {
    font-size: 0.7rem;
    font-weight: 700;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--text3);
    margin-bottom: 14px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .card-title::after {
    content: '';
    flex: 1;
    height: 1px;
    background: var(--border);
  }

  /* フォーム */
  .form-row { margin-bottom: 12px; }
  .form-row label {
    display: block;
    font-size: 0.72rem;
    color: var(--text2);
    margin-bottom: 5px;
    font-weight: 500;
  }
  .form-row input {
    width: 100%;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 12px;
    color: var(--text);
    font-family: 'Noto Sans JP', sans-serif;
    font-size: 0.9rem;
    outline: none;
    transition: border-color 0.2s;
  }
  .form-row input:focus { border-color: var(--accent); }
  .form-row input[type="date"] { color-scheme: dark; }

  /* タブ */
  .tabs {
    display: flex;
    background: var(--surface2);
    border-radius: 8px;
    padding: 3px;
    margin-bottom: 16px;
    gap: 3px;
  }
  .tab {
    flex: 1;
    padding: 8px;
    text-align: center;
    font-size: 0.8rem;
    font-weight: 500;
    border-radius: 6px;
    cursor: pointer;
    color: var(--text3);
    transition: all 0.2s;
    border: none;
    background: transparent;
  }
  .tab.active {
    background: var(--surface);
    color: var(--text);
    box-shadow: 0 1px 4px rgba(0,0,0,0.4);
  }
  .tab-content { display: none; }
  .tab-content.active { display: block; }

  /* ドロップゾーン */
  .dropzone {
    border: 2px dashed var(--border);
    border-radius: 10px;
    padding: 32px 16px;
    text-align: center;
    cursor: pointer;
    transition: all 0.2s;
  }
  .dropzone:hover, .dropzone.drag-over {
    border-color: var(--accent);
    background: rgba(79,142,247,0.05);
  }
  .dropzone-icon { font-size: 2rem; margin-bottom: 8px; }
  .dropzone p { font-size: 0.82rem; color: var(--text2); }
  .dropzone p small { color: var(--text3); font-size: 0.72rem; }
  #fileInput { display: none; }

  /* Driveタブ */
  .drive-load-btn {
    width: 100%;
    padding: 10px;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    font-size: 0.85rem;
    cursor: pointer;
    transition: all 0.2s;
    margin-bottom: 12px;
    font-family: 'Noto Sans JP', sans-serif;
  }
  .drive-load-btn:hover { border-color: var(--accent); color: var(--accent); }

  /* 写真グリッド */
  .photo-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 6px;
    margin-top: 10px;
  }
  .photo-thumb {
    position: relative;
    aspect-ratio: 1;
    border-radius: 6px;
    overflow: hidden;
    cursor: pointer;
    border: 2px solid transparent;
    transition: border-color 0.15s;
  }
  .photo-thumb.selected { border-color: var(--accent2); }
  .photo-thumb img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }
  .photo-thumb .check {
    position: absolute;
    top: 4px;
    right: 4px;
    width: 20px;
    height: 20px;
    border-radius: 50%;
    background: var(--accent2);
    display: none;
    align-items: center;
    justify-content: center;
    font-size: 11px;
  }
  .photo-thumb.selected .check { display: flex; }
  .photo-thumb .num {
    position: absolute;
    bottom: 3px;
    left: 4px;
    font-family: 'Share Tech Mono', monospace;
    font-size: 0.65rem;
    color: white;
    text-shadow: 0 1px 3px rgba(0,0,0,0.8);
  }

  /* 選択コントロール */
  .select-controls {
    display: flex;
    gap: 8px;
    margin-bottom: 10px;
  }
  .select-controls button {
    flex: 1;
    padding: 7px;
    background: transparent;
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--text2);
    font-size: 0.75rem;
    cursor: pointer;
    transition: all 0.2s;
    font-family: 'Noto Sans JP', sans-serif;
  }
  .select-controls button:hover { border-color: var(--accent); color: var(--accent); }

  /* プレビューリスト */
  .preview-list { display: flex; flex-direction: column; gap: 4px; }
  .preview-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 7px 10px;
    background: var(--surface2);
    border-radius: 6px;
    font-size: 0.75rem;
  }
  .preview-item .idx {
    font-family: 'Share Tech Mono', monospace;
    color: var(--accent);
    min-width: 28px;
  }
  .preview-item .fname { color: var(--text2); word-break: break-all; }

  /* 保存先フォルダ */
  .folder-section { margin-top: 4px; }
  .folder-info {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 12px;
    margin-top: 8px;
    font-size: 0.78rem;
  }
  .folder-info .folder-name {
    color: var(--accent2);
    font-weight: 700;
    margin-bottom: 4px;
    word-break: break-all;
  }
  .folder-info .folder-link {
    color: var(--text3);
    font-family: 'Share Tech Mono', monospace;
    font-size: 0.7rem;
    word-break: break-all;
  }
  .folder-info .folder-link a { color: var(--accent); text-decoration: none; }

  .hint {
    font-size: 0.72rem;
    color: var(--text3);
    margin-top: 6px;
    line-height: 1.5;
  }
  .hint span { color: var(--accent); }

  /* 接続ステータス */
  .conn-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    margin-top: 12px;
  }
  .conn-status {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 0.78rem;
  }
  .conn-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--text3);
  }
  .conn-dot.connected { background: var(--accent2); box-shadow: 0 0 6px var(--accent2); }
  .conn-dot.error { background: var(--danger); }

  /* ボタン */
  .btn {
    display: block;
    width: 100%;
    padding: 14px;
    border-radius: 10px;
    border: none;
    font-size: 0.92rem;
    font-weight: 700;
    cursor: pointer;
    font-family: 'Noto Sans JP', sans-serif;
    transition: all 0.2s;
    letter-spacing: 0.03em;
  }
  .btn-primary {
    background: var(--accent);
    color: white;
  }
  .btn-primary:hover:not(:disabled) {
    background: #6fa3ff;
    transform: translateY(-1px);
    box-shadow: 0 4px 16px rgba(79,142,247,0.35);
  }
  .btn-primary:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }
  .btn-connect {
    background: transparent;
    border: 1px solid var(--accent);
    color: var(--accent);
    padding: 8px 16px;
    border-radius: 8px;
    font-size: 0.8rem;
    white-space: nowrap;
    width: auto;
  }
  .btn-connect:hover { background: rgba(79,142,247,0.1); }

  /* ログ */
  .log-area {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 12px;
    font-family: 'Share Tech Mono', monospace;
    font-size: 0.72rem;
    line-height: 1.7;
    max-height: 200px;
    overflow-y: auto;
    margin-top: 12px;
    display: none;
  }
  .log-area.show { display: block; }
  .log-ok { color: var(--accent2); }
  .log-err { color: var(--danger); }
  .log-info { color: var(--text2); }
  .log-warn { color: var(--warn); }

  /* 完了バナー */
  .done-banner {
    background: rgba(52,211,153,0.1);
    border: 1px solid var(--accent2);
    border-radius: 10px;
    padding: 14px 16px;
    text-align: center;
    font-size: 0.88rem;
    color: var(--accent2);
    font-weight: 700;
    margin-top: 12px;
    display: none;
  }
  .done-banner.show { display: block; }
  .done-banner a { color: var(--accent); word-break: break-all; font-size: 0.78rem; font-weight: 400; }

  /* スピナー */
  .spinner {
    display: inline-block;
    width: 14px;
    height: 14px;
    border: 2px solid rgba(255,255,255,0.3);
    border-top-color: white;
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
    vertical-align: middle;
    margin-right: 6px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .count-badge {
    display: inline-block;
    background: var(--accent);
    color: white;
    border-radius: 99px;
    padding: 1px 8px;
    font-size: 0.7rem;
    font-weight: 700;
    margin-left: 6px;
    vertical-align: middle;
  }

  .empty-state {
    text-align: center;
    padding: 28px 16px;
    color: var(--text3);
    font-size: 0.82rem;
  }

  /* プログレスバー */
  .progress-wrap {
    margin-top: 10px;
    display: none;
  }
  .progress-wrap.show { display: block; }
  .progress-bar-bg {
    background: var(--surface2);
    border-radius: 99px;
    height: 6px;
    overflow: hidden;
  }
  .progress-bar-fill {
    height: 100%;
    background: var(--accent);
    border-radius: 99px;
    width: 0%;
    transition: width 0.3s;
  }
  .progress-text {
    font-size: 0.72rem;
    color: var(--text3);
    margin-top: 5px;
    text-align: right;
    font-family: 'Share Tech Mono', monospace;
  }
</style>
<!-- Google Identity Services -->
<script src="https://accounts.google.com/gsi/client" async defer onload="initGsi()"></script>
</head>
<body>

<div class="header">
  <div class="header-icon">🏗️</div>
  <h1>現場写真整理</h1>
  <p>解体工事 / 現場記録管理システム</p>
</div>

<!-- 01 現場情報 -->
<div class="card">
  <div class="card-title">01 現場情報</div>
  <div class="form-row">
    <label>施工日</label>
    <input type="date" id="kojiDate">
  </div>
  <div class="form-row">
    <label>住所</label>
    <input type="text" id="address" placeholder="例：松戸市六高台3-26">
  </div>
  <div class="form-row">
    <label>現場名</label>
    <input type="text" id="genbaName" placeholder="例：軽量鉄骨2f-56tubo">
  </div>
</div>

<!-- 02 写真を選択 -->
<div class="card">
  <div class="card-title">02 写真を選択</div>
  <div class="tabs">
    <button class="tab active" onclick="switchTab('device')">📱 端末から選ぶ</button>
    <button class="tab" onclick="switchTab('drive')">☁️ Driveから選ぶ</button>
  </div>

  <!-- 端末タブ -->
  <div id="tab-device" class="tab-content active">
    <div class="dropzone" id="dropzone" onclick="document.getElementById('fileInput').click()">
      <div class="dropzone-icon">📷</div>
      <p>写真をここにドロップ<br><small>またはタップして選択（複数枚OK）</small></p>
    </div>
    <input type="file" id="fileInput" accept="image/*" multiple>
  </div>

  <!-- Driveタブ -->
  <div id="tab-drive" class="tab-content">
    <button class="drive-load-btn" onclick="loadDrivePhotos()">📂 未整理フォルダを読み込む</button>
    <div id="drivePhotoArea">
      <div class="empty-state">「読み込む」を押してDriveの写真を取得</div>
    </div>
  </div>

  <!-- 選択済み表示 -->
  <div id="selectedArea" style="display:none; margin-top:14px;">
    <div class="select-controls">
      <button onclick="selectAll()">✅ すべて選択</button>
      <button onclick="deselectAll()">⬜ すべて解除</button>
    </div>
    <div class="photo-grid" id="photoGrid"></div>
  </div>
</div>

<!-- 03 ファイル名プレビュー -->
<div class="card">
  <div class="card-title">03 ファイル名プレビュー <span id="previewCount" class="count-badge">0</span></div>
  <div id="previewList" class="preview-list">
    <div class="empty-state">現場情報と写真を入力すると自動生成されます</div>
  </div>
</div>

<!-- 04 保存先設定 -->
<div class="card">
  <div class="card-title">04 Google Drive 設定</div>

  <div class="folder-section">
    <div class="form-row">
      <label>保存先フォルダ（任意）</label>
      <input type="text" id="folderUrl"
        placeholder="既存フォルダのURLを貼り付け（空欄→マイドライブに新規作成）"
        oninput="onFolderUrlInput()">
    </div>

    <div class="hint">
      💡 <span>初回：</span>空欄のままにするとマイドライブに<code>{施工日}-{住所}-{現場名}</code>フォルダを自動作成<br>
      💡 <span>2回目以降：</span>作成済みフォルダのURLを貼ると追加保存されます
    </div>

    <div id="folderPreview" class="folder-info" style="display:none;">
      <div class="folder-name" id="folderPreviewName"></div>
      <div class="folder-link">📎 <a id="folderPreviewLink" href="#" target="_blank">Drive で開く</a></div>
    </div>
  </div>

  <div class="conn-row" style="margin-top:16px;">
    <div class="conn-status">
      <div class="conn-dot" id="connDot"></div>
      <span id="connLabel">未接続</span>
    </div>
    <button class="btn btn-connect" onclick="connectDrive()">🔗 Google Drive に接続する</button>
  </div>
</div>

<!-- 実行ボタン -->
<button class="btn btn-primary" id="runBtn" onclick="runOrganize()" disabled>
  🚀 整理して保存する
</button>

<!-- プログレス -->
<div class="progress-wrap" id="progressWrap">
  <div class="progress-bar-bg"><div class="progress-bar-fill" id="progressFill"></div></div>
  <div class="progress-text" id="progressText">0 / 0</div>
</div>

<!-- ログ -->
<div class="log-area" id="logArea"></div>

<!-- 完了バナー -->
<div class="done-banner" id="doneBanner"></div>

<script>
// ── 定数 ──────────────────────────────────────────────
const CLIENT_ID = '557911723346-bnce8oln4km4lf4a1vlltk3caogt5mtm.apps.googleusercontent.com';
const UNSORTED_FOLDER_ID = '17Dpan8lTYVe56sffwl4ZpQHM0bvKNMBT';
const SCOPE = 'https://www.googleapis.com/auth/drive';

// ── 状態 ──────────────────────────────────────────────
let accessToken = null;
let selectedFiles = [];       // { file, name, driveId? }
let driveItems = [];          // Drive から読み込んだアイテム
let currentTab = 'device';

// ── 初期化 ────────────────────────────────────────────
window.onload = () => {
  const today = new Date();
  const y = today.getFullYear();
  const m = String(today.getMonth()+1).padStart(2,'0');
  const d = String(today.getDate()).padStart(2,'0');
  document.getElementById('kojiDate').value = `${y}-${m}-${d}`;

  document.getElementById('kojiDate').addEventListener('input', updatePreview);
  document.getElementById('address').addEventListener('input', updatePreview);
  document.getElementById('genbaName').addEventListener('input', updatePreview);
  document.getElementById('fileInput').addEventListener('change', onFileSelect);
  setupDrop();
};

// ── タブ切り替え ──────────────────────────────────────
function switchTab(tab) {
  currentTab = tab;
  document.querySelectorAll('.tab').forEach((t,i) => {
    t.classList.toggle('active', (i===0 && tab==='device') || (i===1 && tab==='drive'));
  });
  document.getElementById('tab-device').classList.toggle('active', tab==='device');
  document.getElementById('tab-drive').classList.toggle('active', tab==='drive');
}

// ── ドロップゾーン ────────────────────────────────────
function setupDrop() {
  const dz = document.getElementById('dropzone');
  dz.addEventListener('dragover', e => { e.preventDefault(); dz.classList.add('drag-over'); });
  dz.addEventListener('dragleave', () => dz.classList.remove('drag-over'));
  dz.addEventListener('drop', e => {
    e.preventDefault();
    dz.classList.remove('drag-over');
    addFiles([...e.dataTransfer.files]);
  });
}

function onFileSelect(e) { addFiles([...e.target.files]); }

function addFiles(files) {
  const imgs = files.filter(f => f.type.startsWith('image/'));
  imgs.forEach(f => {
    selectedFiles.push({ file: f, name: f.name, driveId: null });
  });
  renderGrid();
  updatePreview();
}

// ── Drive 読み込み ────────────────────────────────────
async function loadDrivePhotos() {
  if (!accessToken) { alert('先にGoogle Driveに接続してください。'); return; }
  const area = document.getElementById('drivePhotoArea');
  area.innerHTML = '<div class="empty-state"><span class="spinner"></span> 読み込み中...</div>';
  try {
    const res = await gfetch(`https://www.googleapis.com/drive/v3/files?q='${UNSORTED_FOLDER_ID}'+in+parents+and+mimeType+contains+'image/'+and+trashed=false&fields=files(id,name,mimeType,thumbnailLink,webContentLink)&pageSize=100`);
    driveItems = res.files || [];
    if (!driveItems.length) {
      area.innerHTML = '<div class="empty-state">未整理フォルダに写真がありません</div>';
      return;
    }
    // Drive 写真を選択リストに追加
    driveItems.forEach(item => {
      if (!selectedFiles.find(s => s.driveId === item.id)) {
        selectedFiles.push({ file: null, name: item.name, driveId: item.id, thumb: item.thumbnailLink });
      }
    });
    renderGrid();
    updatePreview();
    area.innerHTML = `<div class="empty-state" style="color:var(--accent2)">✅ ${driveItems.length}枚 読み込みました</div>`;
  } catch(e) {
    area.innerHTML = `<div class="empty-state" style="color:var(--danger)">読み込みエラー：${e.message}</div>`;
  }
}

// ── グリッド描画 ──────────────────────────────────────
function renderGrid() {
  const area = document.getElementById('selectedArea');
  const grid = document.getElementById('photoGrid');
  if (!selectedFiles.length) { area.style.display='none'; return; }
  area.style.display = 'block';
  grid.innerHTML = '';
  selectedFiles.forEach((item, idx) => {
    const div = document.createElement('div');
    div.className = 'photo-thumb selected';
    div.dataset.idx = idx;
    div.onclick = () => toggleThumb(idx);

    if (item.file) {
      const url = URL.createObjectURL(item.file);
      div.innerHTML = `<img src="${url}"><div class="check">✓</div><div class="num">${idx+1}</div>`;
    } else {
      div.innerHTML = `<img src="${item.thumb || ''}"><div class="check">✓</div><div class="num">${idx+1}</div>`;
    }
    grid.appendChild(div);
  });
}

function toggleThumb(idx) {
  const el = document.querySelector(`.photo-thumb[data-idx="${idx}"]`);
  el.classList.toggle('selected');
  updatePreview();
}

function selectAll() { document.querySelectorAll('.photo-thumb').forEach(t => t.classList.add('selected')); updatePreview(); }
function deselectAll() { document.querySelectorAll('.photo-thumb').forEach(t => t.classList.remove('selected')); updatePreview(); }

// ── プレビュー更新 ────────────────────────────────────
function updatePreview() {
  const date = document.getElementById('kojiDate').value;
  const genba = document.getElementById('genbaName').value.trim();
  const list = document.getElementById('previewList');
  const count = document.getElementById('previewCount');
  const runBtn = document.getElementById('runBtn');

  const selected = getSelectedFiles();
  count.textContent = selected.length;

  if (!selected.length || !date || !genba) {
    list.innerHTML = '<div class="empty-state">現場情報と写真を入力すると自動生成されます</div>';
    runBtn.disabled = true;
    return;
  }

  const dateStr = date.replace(/-/g,'');
  list.innerHTML = selected.map((item, i) => {
    const ext = item.name.split('.').pop().toLowerCase();
    const newName = `${dateStr}_${String(i+1).padStart(3,'0')}_${genba}.${ext}`;
    return `<div class="preview-item"><span class="idx">${String(i+1).padStart(3,'0')}</span><span class="fname">${newName}</span></div>`;
  }).join('');

  runBtn.disabled = !(accessToken && selected.length && date && genba);
}

function getSelectedFiles() {
  const thumbs = document.querySelectorAll('.photo-thumb.selected');
  const idxs = [...thumbs].map(t => parseInt(t.dataset.idx));
  return idxs.map(i => selectedFiles[i]);
}

// ── フォルダURL解析 ───────────────────────────────────
function extractFolderId(url) {
  const m = url.match(/[-\w]{25,}/);
  return m ? m[0] : null;
}

function onFolderUrlInput() {
  const url = document.getElementById('folderUrl').value.trim();
  const preview = document.getElementById('folderPreview');
  if (!url) { preview.style.display='none'; return; }
  const id = extractFolderId(url);
  if (id) {
    document.getElementById('folderPreviewName').textContent = `📂 フォルダID: ${id}`;
    document.getElementById('folderPreviewLink').href = `https://drive.google.com/drive/folders/${id}`;
    preview.style.display = 'block';
  } else {
    preview.style.display = 'none';
  }
}

// ── Google 認証（GSI TokenClient）────────────────────
let tokenClient = null;

function initGsi() {
  tokenClient = google.accounts.oauth2.initTokenClient({
    client_id: CLIENT_ID,
    scope: SCOPE,
    callback: (resp) => {
      if (resp.error) {
        setConnected(false);
        alert('認証エラー: ' + resp.error);
        return;
      }
      accessToken = resp.access_token;
      setConnected(true);
      updatePreview();
    },
  });
}

function connectDrive() {
  if (!tokenClient) { alert('GSIライブラリ読み込み中です。少し待ってから再試行してください。'); return; }
  tokenClient.requestAccessToken({ prompt: 'consent' });
}

function setConnected(ok) {
  const dot = document.getElementById('connDot');
  const lbl = document.getElementById('connLabel');
  dot.className = 'conn-dot ' + (ok ? 'connected' : 'error');
  lbl.textContent = ok ? '接続済み' : 'エラー';
}

// ── Drive API ─────────────────────────────────────────
async function gfetch(url, opts={}) {
  const res = await fetch(url, {
    ...opts,
    headers: { Authorization: `Bearer ${accessToken}`, ...(opts.headers||{}) }
  });
  if (!res.ok) {
    const txt = await res.text();
    throw new Error(`API ${res.status}: ${txt}`);
  }
  if (res.status === 204) return {};
  return res.json();
}

// ── フォルダ取得または作成 ────────────────────────────
async function getOrCreateFolder(parentId, folderName) {
  // 既存チェック
  const q = encodeURIComponent(`'${parentId}' in parents and name='${folderName}' and mimeType='application/vnd.google-apps.folder' and trashed=false`);
  const res = await gfetch(`https://www.googleapis.com/drive/v3/files?q=${q}&fields=files(id,name,webViewLink)&pageSize=1`);
  if (res.files && res.files.length) {
    log(`既存フォルダを使用: ${folderName}`, 'warn');
    return res.files[0];
  }
  // 新規作成
  const body = { name: folderName, mimeType: 'application/vnd.google-apps.folder', parents: [parentId] };
  const created = await gfetch('https://www.googleapis.com/drive/v3/files?fields=id,name,webViewLink', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(body)
  });
  log(`フォルダ作成: ${folderName}`, 'ok');
  return created;
}

// ── マイドライブルートID取得 ──────────────────────────
async function getRootId() {
  const res = await gfetch('https://www.googleapis.com/drive/v3/files/root?fields=id');
  return res.id;
}

// ── ファイルアップロード ──────────────────────────────
async function uploadFile(file, fileName, folderId) {
  const meta = { name: fileName, parents: [folderId] };
  const form = new FormData();
  form.append('metadata', new Blob([JSON.stringify(meta)], { type: 'application/json' }));
  form.append('file', file);
  const res = await fetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id,name', {
    method: 'POST',
    headers: { Authorization: `Bearer ${accessToken}` },
    body: form
  });
  if (!res.ok) throw new Error(`Upload failed: ${res.status}`);
  return res.json();
}

// ── DriveファイルをコピーしてリネームDrive→別フォルダ ──
async function copyAndRename(driveId, newName, destFolderId) {
  const res = await gfetch(`https://www.googleapis.com/drive/v3/files/${driveId}/copy?fields=id,name`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ name: newName, parents: [destFolderId] })
  });
  return res;
}

// ── 未整理フォルダから削除 ────────────────────────────
async function removeFromUnsorted(driveId) {
  await gfetch(`https://www.googleapis.com/drive/v3/files/${driveId}?removeParents=${UNSORTED_FOLDER_ID}&addParents=`, {
    method: 'PATCH',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({})
  });
}

// ── ログ ──────────────────────────────────────────────
function log(msg, type='info') {
  const el = document.getElementById('logArea');
  el.classList.add('show');
  const line = document.createElement('div');
  line.className = `log-${type}`;
  const prefix = { ok:'✅', err:'❌', info:'·', warn:'⚠️' }[type] || '·';
  line.textContent = `${prefix} ${msg}`;
  el.appendChild(line);
  el.scrollTop = el.scrollHeight;
}

// ── プログレス ────────────────────────────────────────
function setProgress(cur, total) {
  const wrap = document.getElementById('progressWrap');
  wrap.classList.add('show');
  document.getElementById('progressFill').style.width = `${Math.round(cur/total*100)}%`;
  document.getElementById('progressText').textContent = `${cur} / ${total}`;
}

// ── メイン処理 ────────────────────────────────────────
async function runOrganize() {
  const dateVal = document.getElementById('kojiDate').value;
  const address = document.getElementById('address').value.trim();
  const genba = document.getElementById('genbaName').value.trim();
  const folderUrlVal = document.getElementById('folderUrl').value.trim();
  const selected = getSelectedFiles();

  if (!dateVal || !genba || !selected.length) {
    alert('施工日・現場名・写真を入力してください。');
    return;
  }

  const runBtn = document.getElementById('runBtn');
  runBtn.disabled = true;
  runBtn.innerHTML = '<span class="spinner"></span> 処理中...';
  document.getElementById('logArea').innerHTML = '';
  document.getElementById('logArea').classList.remove('show');
  document.getElementById('doneBanner').classList.remove('show');
  document.getElementById('progressWrap').classList.remove('show');

  try {
    // 日付フォーマット
    const [y,m,d] = dateVal.split('-');
    const dateDisp = `${y}.${parseInt(m)}.${parseInt(d)}`;
    const dateFile = `${y}${m}${d}`;

    // フォルダ名
    const folderName = address
      ? `${dateDisp}-${address}-${genba}`
      : `${dateDisp}-${genba}`;

    // 保存先フォルダIDを決定
    let destFolderId;
    let destFolderLink;

    if (folderUrlVal) {
      // URLが入力されている → そのフォルダに保存
      const fid = extractFolderId(folderUrlVal);
      if (!fid) throw new Error('フォルダURLが正しくありません');
      destFolderId = fid;
      destFolderLink = `https://drive.google.com/drive/folders/${fid}`;
      log(`保存先フォルダを指定: ${fid}`, 'info');
    } else {
      // 空欄 → マイドライブに新規作成（同名があれば再利用）
      log('保存先未指定 → マイドライブに自動作成します', 'info');
      const rootId = await getRootId();
      const folder = await getOrCreateFolder(rootId, folderName);
      destFolderId = folder.id;
      destFolderLink = folder.webViewLink || `https://drive.google.com/drive/folders/${folder.id}`;
    }

    log(`フォルダ: ${folderName}`, 'info');

    // ファイルを順番に処理
    const total = selected.length;
    for (let i = 0; i < total; i++) {
      const item = selected[i];
      const ext = item.name.split('.').pop().toLowerCase() || 'jpg';
      const newName = `${dateFile}_${String(i+1).padStart(3,'0')}_${genba}.${ext}`;

      setProgress(i, total);

      if (item.file) {
        // 端末ファイル → アップロード
        await uploadFile(item.file, newName, destFolderId);
        log(`アップロード: ${newName}`, 'ok');
      } else if (item.driveId) {
        // Driveファイル → コピー＆リネーム
        await copyAndRename(item.driveId, newName, destFolderId);
        log(`コピー: ${newName}`, 'ok');
        // 未整理フォルダから削除
        try {
          await removeFromUnsorted(item.driveId);
          log(`未整理から削除: ${item.name}`, 'info');
        } catch(e) {
          log(`削除スキップ: ${e.message}`, 'warn');
        }
      }
    }

    setProgress(total, total);

    // 完了
    const banner = document.getElementById('doneBanner');
    banner.innerHTML = `✅ 完了しました！ ${total}枚を保存しました<br>
      <a href="${destFolderLink}" target="_blank">📂 保存先フォルダを開く</a><br>
      <span style="font-size:0.72rem;color:var(--text3);font-weight:400;">次回はこのURLを「保存先フォルダ」に貼り付けると追加保存できます</span>`;
    banner.classList.add('show');

    log('処理完了！', 'ok');

    // 保存先URL欄に今回のフォルダURLを入れておく
    document.getElementById('folderUrl').value = destFolderLink;
    onFolderUrlInput();

  } catch(e) {
    log(`エラー: ${e.message}`, 'err');
    alert(`エラーが発生しました：\n${e.message}`);
  } finally {
    runBtn.disabled = false;
    runBtn.innerHTML = '🚀 整理して保存する';
    updatePreview();
  }
}
</script>
